[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["nonebot_plugin_fishspeech_tts"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project]
name = "nonebot-plugin-fishspeech-tts"
version = "0.4.0"
description = "小样本TTS,通过调用在线或本地api发送TTS语音"
authors = [
    {name = "Cvandia",email = "106718176+Cvandia@users.noreply.github.com"},
]
dependencies = [
    "ormsgpack<2.0.0,>=1.7.0",
    "httpx>=0.27.0,<1",
    "nonebot2>=2.2.0",
    "pydantic>=2.0,<3",
    "nonebot-plugin-alconna>=0.46.4",
]
requires-python = "<4.0,>=3.10"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "ruff==0.9.4",
    "pre-commit>=4.0.1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "nonebot2[fastapi]>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
