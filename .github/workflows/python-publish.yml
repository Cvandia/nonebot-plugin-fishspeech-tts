name: Publish package to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag does not match package version')
          PY
      - run: uv venv
      - run: uv pip install -e . --group dev
      - run: uv run --no-project ruff check .
      - run: uv run --no-project ruff format --check .
      - run: uv run --no-project pytest -q
      - run: uv build
      - run: uvx --from twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
