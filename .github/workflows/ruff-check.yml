name: Ruff Lint

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - nonebot_plugin_fishspeech_tts/**
      - pyproject.toml

jobs:
  ruff:
    name: Ruff Lint
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Run Ruff
        run: uvx --from ruff==0.9.4 ruff check .
